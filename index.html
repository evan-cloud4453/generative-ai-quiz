<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>생성형 AI 입문 — 퀴즈 학습기</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1c232d;
    --line: #2a323d;
    --ink: #e6edf3;
    --ink-dim: #9aa7b4;
    --ink-faint: #6b7682;
    --accent: #5ad1a8;        /* signature mint */
    --accent-dim: #2f7d63;
    --right: #5ad1a8;
    --wrong: #ff6b6b;
    --warn: #f0b252;
    --radius: 14px;
    --mono: "SFMono-Regular", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo",
            "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 600px at 50% -10%, #18222c 0%, var(--bg) 60%);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 28px 18px 80px; }

  /* Header */
  header { margin-bottom: 22px; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.18em;
    color: var(--accent);
    text-transform: uppercase;
    margin: 0 0 6px;
  }
  h1 { font-size: 26px; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--ink-dim); font-size: 14px; margin-top: 6px; }

  /* Cards / panels */
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
  }
  .panel + .panel { margin-top: 16px; }

  .section-title {
    font-size: 13px; font-weight: 700; letter-spacing: 0.04em;
    color: var(--ink-dim); text-transform: uppercase; margin: 0 0 14px;
    font-family: var(--mono);
  }

  /* Week grid */
  .grid {
    display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
  }
  .chip {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 8px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, transform .05s, background .15s;
    user-select: none;
  }
  .chip:hover { border-color: var(--accent-dim); }
  .chip:active { transform: translateY(1px); }
  .chip .w { font-weight: 700; font-size: 15px; }
  .chip .c { font-size: 11px; color: var(--ink-faint); margin-top: 2px; font-family: var(--mono); }
  .chip.wide { grid-column: 1 / -1; }
  .chip.accent { border-color: var(--accent-dim); }

  /* Toggle row */
  .opts-row { display:flex; flex-wrap:wrap; gap:14px; margin-top:16px; align-items:center; }
  label.toggle { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--ink-dim); cursor:pointer; }
  input[type=checkbox]{ width:16px; height:16px; accent-color: var(--accent); cursor:pointer; }

  /* Buttons */
  .btn {
    appearance:none; border:1px solid var(--line); background:var(--panel-2);
    color:var(--ink); font-family:var(--sans); font-size:14px; font-weight:600;
    padding:11px 18px; border-radius:10px; cursor:pointer; transition: all .15s;
  }
  .btn:hover { border-color: var(--accent-dim); }
  .btn.primary { background: var(--accent); color:#06231a; border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.ghost { background: transparent; }
  .btn.danger { color: var(--wrong); border-color: #50313a; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-row { display:flex; gap:10px; flex-wrap:wrap; }

  /* Quiz */
  .qmeta { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; font-family:var(--mono); font-size:12px; color:var(--ink-faint); }
  .progress { height:5px; background:var(--panel-2); border-radius:99px; overflow:hidden; margin-bottom:18px; }
  .progress > i { display:block; height:100%; background:var(--accent); width:0; transition: width .25s; }
  .qtext { font-size:17px; font-weight:600; margin:0 0 18px; white-space: pre-wrap; }
  .qtag { font-family:var(--mono); font-size:11px; color:var(--accent); letter-spacing:.08em; }

  .choices { display:flex; flex-direction:column; gap:10px; }
  .choice {
    text-align:left; border:1px solid var(--line); background:var(--panel-2);
    color:var(--ink); padding:13px 15px; border-radius:11px; cursor:pointer;
    font-size:15px; transition: border-color .12s, background .12s; display:flex; gap:11px; align-items:flex-start;
  }
  .choice .k { font-family:var(--mono); color:var(--ink-faint); flex:0 0 auto; }
  .choice:hover:not(.locked) { border-color: var(--accent-dim); }
  .choice.locked { cursor: default; }
  .choice.correct { border-color: var(--right); background: rgba(90,209,168,.12); }
  .choice.correct .k { color: var(--right); }
  .choice.chosen-wrong { border-color: var(--wrong); background: rgba(255,107,107,.10); }
  .choice.chosen-wrong .k { color: var(--wrong); }

  .feedback { margin-top:16px; font-size:14px; padding:12px 14px; border-radius:10px; display:none; }
  .feedback.show { display:block; }
  .feedback.ok { background: rgba(90,209,168,.10); color: var(--right); }
  .feedback.no { background: rgba(255,107,107,.08); color: #ffb3b3; }
  .feedback b { color: var(--ink); }

  .quiz-footer { margin-top:20px; display:flex; justify-content:space-between; align-items:center; }

  /* Result */
  .score-big { font-size:48px; font-weight:800; letter-spacing:-0.02em; }
  .score-big small { font-size:20px; color:var(--ink-dim); font-weight:600; }
  .ring { color: var(--accent); }

  /* History */
  .attempt {
    border:1px solid var(--line); border-radius:11px; background:var(--panel-2);
    margin-bottom:10px; overflow:hidden;
  }
  .attempt summary {
    list-style:none; cursor:pointer; padding:14px 16px; display:flex;
    justify-content:space-between; align-items:center; gap:10px;
  }
  .attempt summary::-webkit-details-marker { display:none; }
  .attempt .a-meta { font-family:var(--mono); font-size:12px; color:var(--ink-faint); }
  .a-score { font-weight:700; }
  .a-body { padding:0 16px 16px; border-top:1px solid var(--line); }
  .miss { padding:12px 0; border-bottom:1px dashed var(--line); }
  .miss:last-child { border-bottom:none; }
  .miss .mq { font-weight:600; font-size:14px; white-space:pre-wrap; }
  .miss .ml { font-size:13px; margin-top:6px; }
  .miss .ml .x { color: var(--wrong); }
  .miss .ml .o { color: var(--right); }

  .empty { color: var(--ink-faint); font-size:14px; text-align:center; padding:18px 0; }
  .hr { height:1px; background:var(--line); border:0; margin:22px 0; }

  /* Nav tabs */
  .tabs { display:flex; gap:8px; margin-bottom:18px; }
  .tab {
    font-size:13px; font-weight:600; padding:8px 14px; border-radius:999px;
    border:1px solid var(--line); background:transparent; color:var(--ink-dim); cursor:pointer;
  }
  .tab.on { background: var(--panel); color: var(--ink); border-color: var(--accent-dim); }

  .hidden { display:none !important; }
  .stat-row { display:flex; gap:18px; flex-wrap:wrap; margin-top:4px; }
  .stat { font-family:var(--mono); font-size:12px; color:var(--ink-dim); }
  .stat b { color:var(--ink); font-size:16px; display:block; }
  footer.foot { text-align:center; color:var(--ink-faint); font-size:12px; margin-top:34px; font-family:var(--mono); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">GENERATIVE&nbsp;AI · QUIZ&nbsp;TRAINER</p>
    <h1>생성형 인공지능 입문 — 퀴즈 학습기</h1>
    <p class="sub">1~15주차 · 215문항(기본 85 + 변형 130) · 오답은 이 브라우저에 저장됩니다</p>
  </header>

  <div class="tabs">
    <button class="tab on" data-tab="home">시작</button>
    <button class="tab" data-tab="variant">변형</button>
    <button class="tab" data-tab="history">기록 열람</button>
  </div>

  <!-- ============ HOME ============ -->
  <section id="view-home">
    <div class="panel">
      <p class="section-title">주차 선택</p>
      <div class="grid" id="weekGrid"></div>
      <div class="opts-row">
        <label class="toggle"><input type="checkbox" id="optShuffleQ" checked> 문항 순서 섞기</label>
        <label class="toggle"><input type="checkbox" id="optShuffleC"> 보기 순서 섞기</label>
      </div>
    </div>

    <div class="panel">
      <p class="section-title">복습</p>
      <div class="btn-row">
        <button class="btn" id="btnWrongOnly">오답 노트만 다시 풀기</button>
        <button class="btn" id="btnAll">전체 14주차 한 번에</button>
      </div>
      <div class="stat-row" id="homeStats" style="margin-top:16px;"></div>
    </div>
  </section>


  <!-- ============ VARIANT (변형 문제) ============ -->
  <section id="view-variant" class="hidden">
    <div class="panel" style="border-color: var(--accent-dim); border-width:1.5px;">
      <p class="section-title" style="color:var(--accent);">변형 문제 · 주차 선택</p>
      <p style="font-size:13px;color:var(--ink-dim);margin:0 0 14px;">기말고사 대비 심화 변형 문제 (이해 중심 · 주차 당 10문항)</p>
      <div class="grid" id="weekGridV"></div>
      <div class="opts-row">
        <label class="toggle"><input type="checkbox" id="optShuffleQV" checked> 문항 순서 섞기</label>
        <label class="toggle"><input type="checkbox" id="optShuffleCV"> 보기 순서 섞기</label>
      </div>
    </div>
    <div class="panel">
      <p class="section-title">변형 복습</p>
      <div class="btn-row">
        <button class="btn" id="btnWrongOnlyV">변형 오답만 다시 풀기</button>
        <button class="btn" id="btnAllV">변형 전체 한 번에</button>
      </div>
      <div class="stat-row" id="homeStatsV" style="margin-top:16px;"></div>
    </div>
  </section>

  <!-- ============ QUIZ ============ -->
  <section id="view-quiz" class="panel hidden">
    <div class="qmeta">
      <span id="qScope" class="qtag"></span>
      <span id="qCount"></span>
    </div>
    <div class="progress"><i id="qBar"></i></div>
    <p class="qtext" id="qText"></p>
    <div class="choices" id="qChoices"></div>
    <div class="feedback" id="qFeedback"></div>
    <div class="quiz-footer">
      <button class="btn ghost" id="btnQuit">그만두기</button>
      <button class="btn primary" id="btnNext" disabled>다음 →</button>
    </div>
  </section>

  <!-- ============ RESULT ============ -->
  <section id="view-result" class="panel hidden">
    <p class="section-title">결과</p>
    <div class="score-big"><span class="ring" id="rScore">0</span><small> / <span id="rTotal">0</span></small></div>
    <p class="sub" id="rPct"></p>
    <hr class="hr">
    <p class="section-title" id="rMissTitle">틀린 문항</p>
    <div id="rMisses"></div>
    <div class="btn-row" style="margin-top:18px;">
      <button class="btn primary" id="btnRetryWrong">틀린 것만 다시</button>
      <button class="btn" id="btnHome">처음으로</button>
    </div>
  </section>

  <!-- ============ HISTORY ============ -->
  <section id="view-history" class="hidden">
    <div class="panel">
      <p class="section-title">통계</p>
      <div class="stat-row" id="histStats"></div>
    </div>
    <div class="panel">
      <p class="section-title">지난 응시 기록</p>
      <div id="histList"></div>
      <div class="btn-row" style="margin-top:16px;">
        <button class="btn danger" id="btnClear">모든 기록 삭제</button>
      </div>
    </div>
  </section>

  <footer class="foot">localStorage 기반 · GitHub Pages 호환 · 단일 파일</footer>
</div>

<script>
/* =====================================================================
   문제 은행 — 문서의 정답 해설지를 그대로 반영 (정답은 0-based 인덱스)
   ===================================================================== */
const BANK = [
{w:1,q:"ChatGPT는 OpenAI에서 개발한 초거대 언어모델 _____ 입니다.",c:["CNN","DALL-E","Large Language Model(LLM)","GAN"],a:2},
{w:1,q:"생성형 인공지능 출력의 종류가 아닌 것은?",c:["이미지 생성","아바타 생성","텍스트 생성","비디오 생성"],a:1},
{w:1,q:"인지 인공지능의 구성요소가 아닌 것은?",c:["지식 표현","학습","자연어 처리","연산 비전"],a:3},
{w:1,q:"언어생성은 컴퓨터 프로그램을 사용하여 자연스러운 인간 언어의 규범에 부합하는 ______ 를 생성하는 프로세스입니다.",c:["텍스트","이미지","오디오","코드"],a:0},
{w:1,q:"언어 생성을 위한 데이터 집합을 ______ 라고 합니다.",c:["텍스트 코엑스","텍스트 코퍼스","비디오 코런스","오디오 코랜스"],a:1},

{w:2,q:"시퀀스 대 시퀀스(seq2seq) 네트워크는 _____ 와 ______ 라는 두 개의 RNN으로 구성된 모델입니다.",c:["돼코더와 엔코더","인코더와 디코더","디스코와 앵코스","코트라와 앵갤스"],a:1},
{w:2,q:"어텐션 함수의 본질은 _____ 를 ______ 쌍의 집합에 매핑하는 것으로 설명할 수 있습니다.",c:["보리 샵-값","퀴리 키-값","사리 솝-값","소리 푼-값"],a:1},
{w:2,q:"순환 신경망(RNN)은 _____ 또는 ______ 를 위해 설계된 신경망 모델의 한 유형이다.",c:["순차적, 시계열","역차적, 도르레열","오차적, 열감지열","배차적, 전자열"],a:0},
{w:2,q:"RNN 인코더-디코더 성능 제한의 해결책은 ______ 를 사용하는 아키텍처를 사용하고 ______ 을 추가하는 것입니다.",c:["고변 길이 벡터, 고의 메커니즘","개변 길이 벡터, 조절 메커니즘","가변 길이 벡터, 주의 메커니즘","전변 길이 벡터, 확인 메커니즘"],a:2},
{w:2,q:"LSTM의 세 가지 유형의 게이트가 아닌 것은?",c:["쿠다-게이트","포겟-게이트","입력-게이트","출력-게이트"],a:0},

{w:3,q:"머신 러닝에서 ______ 과 ______ 은 분리되어 있다.",c:["특징 추출, 다운스트림 작업","특징 확인, 업그레이드 작업","특징 노출, 다운그레이드 작업","특징 확충, 애플리케이션 작업"],a:0},
{w:3,q:"이동 불변성이란 동일한 물체의 ______ 이나 ______ 를 약간만 변경해도 해당 물체를 인식하는 뉴런이 활성화되지 않을 수 있다는 의미.",c:["풍향, 위치","방향, 위치","무게, 회전","활성, 이동"],a:1},
{w:3,q:"활성화 함수의 기능이 아닌 것은?",c:["쌍곡탄젠트(Tanh)","정류된 선형 단위(ReLU)","시그모이드","코싸인"],a:3},
{w:3,q:"컨볼루션 신경망의 주요 구성 요소가 아닌 것은?",c:["컨볼루션 레이어","풀링 레이어","완전 연결 레이어","생성적 대립 신경망 레이어"],a:3},
{w:3,q:"최적화 알고리즘은 학습 과정에서 모델의 파라미터 ______ 및 ______ 를 조정하는 중요한 구성 요소.",c:["무게, 편풍","가중치, 편향","손실, 학습","손해, 발전"],a:1},

{w:4,q:"트랜스포머 모델의 구성 요소가 아닌 것은?",c:["인코더","임베딩","디코더","위치 기반 피드 포워드 네트워크"],a:1},
{w:4,q:"워드임베딩은 단어를 고차원 벡터 공간에서 밀도가 높은 벡터로 표현하는 ____ 의 기술이다.",c:["NHP","NGL","NLP","NAT"],a:2},
{w:4,q:"자기주의(확장된 도트-제품 주의)는 _____ 및 ______ 의 메커니즘으로, 각 요소를 처리할 때 입력 시퀀스의 다른 부분에 집중할 수 있게 한다.",c:["딥러닝, 자연어처리","머신러닝, 외국어처리","메타버스, 기계어처리","생성형AI, 외계어처리"],a:0},
{w:4,q:"멀티 헤드 어텐션의 장점이 아닌 것은?",c:["빠른 연산","상황별 이해도 향상","축소","향상된 성능"],a:2},
{w:4,q:"자기주의(Self-Attention)의 이점이 아닌 것은?",c:["장거리 종속성 파악","병렬처리","확장성","이중 모드 애플리케이션"],a:3},

{w:5,q:"ViT 모델의 한계점으로 가장 적합한 설명은?",c:["이미지 처리 속도가 CNN에 비해 현저히 느리다.","컨볼루션 레이어가 없어 저해상도 이미지 처리 성능이 낮다.","비정형 데이터 처리에 한계가 있다.","대규모 학습 데이터가 없으면 성능이 떨어질 수 있다."],a:3},
{w:5,q:"ViT와 CNN에서 이미지 처리 방식의 주요 차이점은?",c:["ViT는 패치 간 전역적 관계를 학습해 특징을 추출하고, CNN은 컨볼루션 필터로 지역적 특징을 추출한다.","ViT는 픽셀 단위로, CNN은 패치 단위로 처리한다.","ViT는 컨볼루션 레이어를, CNN은 어텐션 메커니즘을 사용한다.","ViT는 3D, CNN은 2D 이미지 처리에 특화되어 있다."],a:0},
{w:5,q:"ViT에서 position embedding을 추가하지 않을 경우 발생할 수 있는 문제점은?",c:["계산 복잡도가 급격히 증가한다.","패치 크기가 고정되지 않아 불안정하게 학습된다.","패치 간 순서 정보가 손실되어 순차적 구조를 학습할 수 없다.","패치 간 공간적 유사성을 고려하지 못한다."],a:2},
{w:5,q:"영상 패치 임베딩에 대한 설명 중 올바르지 않은 것은?",c:["이미지를 작은 패치로 분할하고 각 패치를 고정 차원 벡터로 변환한다.","글로벌 특징을 잘 포착하기 위해 고안된 방법이다.","모델의 입력 크기를 고정하여 입력할 수 있다.","큰 이미지를 처리하는 데 효율적이다."],a:1},
{w:5,q:"U-Net의 U자형 구조가 갖는 이점은?",c:["입력 해상도를 낮추고 출력 해상도를 높인다.","영상의 공간 정보를 보존하면서 크기를 줄이고 특징을 추출하는 데 유용하다.","파라미터 수를 줄여 계산 효율을 높인다.","색상 정보를 강화하여 학습 성능을 높인다."],a:1},

{w:6,q:"미세조정(Fine-tuning)이란?",c:["학습 데이터를 모두 처음부터 학습하는 과정","사전 학습된 모델을 특정 작업에 맞게 조정하는 과정","새로운 모델을 만드는 과정","학습된 모델의 크기를 줄이는 과정"],a:1},

{w:6,q:"MLM에서 '마스크된 단어'를 예측하는 과정이 중요한 이유는?",c:["문맥 정보를 학습하여 더 정확한 언어 모델을 만들기 위해서","문장을 더 짧게 요약하기 위해서","단어 간 순서 관계를 유지하기 위해서","문장의 다음 단어를 생성하기 위해서"],a:0},

{w:8,q:"[중간고사] LSTM의 망각 게이트(forget gate)의 역할은?",c:["네트워크가 입력의 특정 정보를 기억하거나 잊도록 조절한다.","입력을 네트워크의 출력으로 변환한다.","현재 입력을 기반으로 은닉 상태를 초기화한다.","모델이 다음 단계로 어떤 정보를 전달할지 결정한다."],a:0},
{w:8,q:"[중간고사] RNN 기울기 폭발(Gradient Explosion) 문제의 원인·해결로 옳은 것은?",c:["너무 큰 데이터를 학습할 때 발생하며 Seq2Seq 모델로 해결한다.","출력이 항상 0에 가까울 때 발생하며 정규화로 방지한다.","역전파 중 기울기가 급격히 커져 가중치 업데이트가 과해져 학습이 불안정해지며, LSTM 같은 구조가 도입되었다.","입력 데이터 양이 많을 때 발생하며 주의 메커니즘으로 해결한다."],a:2},

{w:8,q:"[중간고사] 언어 번역에 대한 설명 중 틀린 것은?",c:["문장의 시작은 EOS, 끝은 SOS를 추가한다.","NLP 기반 번역은 통계적·신경망·트랜스포머 기술로 복잡성을 처리해 고품질 번역을 생성한다.","각 고유 단어는 숫자로 변환되어 one-hot 벡터로 표현된다.","인코더는 입력 시퀀스를 읽어 단일 벡터를 출력하고, 디코더는 그 벡터를 읽어 출력 시퀀스를 생성한다."],a:0},

{w:1,q:"BERT의 구조적 특징인 '양방향(Bidirectional)' 인코더의 의미로 가장 정확한 것은? [1주차]",c:["문장을 왼쪽에서 오른쪽, 오른쪽에서 왼쪽 두 번 순차적으로 처리한다.","입력 시퀀스의 모든 위치에서 양쪽 문맥을 동시에 참조하여 표현을 학습한다.","인코더와 디코더를 양쪽에 배치하여 번역 성능을 높인다.","두 개의 독립적인 RNN을 결합한 구조이다."],a:1},

// ===== 2주차 (10문항) =====
{w:2,q:"RNN에서 기울기 소실(Vanishing Gradient) 문제가 발생하는 근본 원인으로 가장 정확한 것은? [2주차]",c:["입력 데이터의 차원이 너무 높기 때문에","역전파 시 시간 단계마다 기울기가 연속적으로 곱해지면서 0에 가까워지기 때문에","학습률(learning rate)이 너무 크게 설정되었기 때문에","활성화 함수로 ReLU를 사용했기 때문에"],a:1},
{w:2,q:"LSTM에서 셀 상태(cell state)와 은닉 상태(hidden state)의 역할 차이로 가장 적절한 것은? [2주차]",c:["셀 상태는 단기 정보를, 은닉 상태는 장기 정보를 저장한다.","셀 상태는 장기 정보를 게이트를 통해 보존·수정하고, 은닉 상태는 현재 시점의 출력 표현을 담당한다.","셀 상태와 은닉 상태는 동일한 정보를 담되 차원만 다르다.","셀 상태는 인코더에만, 은닉 상태는 디코더에만 사용된다."],a:1},
{w:2,q:"Seq2Seq 모델에서 인코더가 입력 시퀀스를 고정 길이의 단일 벡터로 압축할 때 발생하는 가장 큰 문제점은? [2주차]",c:["디코더의 학습 속도가 느려진다.","인코더의 파라미터 수가 증가한다.","입력 시퀀스가 길어질수록 앞부분의 정보가 손실되는 병목(bottleneck) 현상이 발생한다.","출력 시퀀스의 길이를 자유롭게 조절할 수 없다."],a:2},
{w:2,q:"어텐션 메커니즘이 Seq2Seq 모델의 성능을 향상시키는 핵심 원리는? [2주차]",c:["인코더의 파라미터를 줄여 모델을 경량화한다.","디코더가 출력을 생성할 때마다 인코더의 모든 은닉 상태를 가중합하여 관련성 높은 입력 부분에 집중한다.","인코더와 디코더의 가중치를 공유하여 학습 효율을 높인다.","입력 시퀀스를 역순으로 처리하여 최근 정보를 우선시한다."],a:1},
{w:2,q:"RNN 기반 언어 번역에서 SOS와 EOS 토큰의 역할을 올바르게 설명한 것은? [2주차]",c:["SOS는 문장의 끝을, EOS는 문장의 시작을 나타낸다.","SOS는 디코더의 첫 입력으로 문장 생성 시작을 알리고, EOS는 생성 종료 시점을 알린다.","SOS와 EOS 모두 인코더에서만 사용되는 특수 토큰이다.","SOS는 패딩 역할을, EOS는 구분자 역할을 한다."],a:1},
{w:2,q:"One-hot 인코딩의 한계점으로 가장 적절한 것은? [2주차]",c:["숫자로 변환할 수 없어 신경망에 입력이 불가능하다.","어휘 크기가 커질수록 벡터 차원이 폭발적으로 증가하며, 단어 간 의미적 유사도를 표현할 수 없다.","순서 정보가 포함되어 있어 모델이 편향된 학습을 한다.","문장 단위로만 사용 가능하고 단어 단위 표현이 불가능하다."],a:1},
{w:2,q:"RNN이 순차적(sequential) 데이터 처리에 적합한 이유로 가장 정확한 것은? [2주차]",c:["각 시점마다 독립적으로 입력을 처리하기 때문에","이전 시점의 은닉 상태를 다음 시점에 전달하여 시간적 문맥 정보를 누적하기 때문에","병렬 처리가 가능하여 긴 시퀀스도 빠르게 처리하기 때문에","컨볼루션 연산을 시간축에 적용하기 때문에"],a:1},
{w:2,q:"LSTM의 입력 게이트(input gate)가 수행하는 핵심 기능은? [2주차]",c:["이전 셀 상태의 정보를 선택적으로 삭제한다.","현재 입력에서 어떤 새로운 정보를 셀 상태에 추가할지 결정한다.","셀 상태의 정보를 은닉 상태로 변환한다.","다음 시점으로 전달할 기울기의 크기를 조절한다."],a:1},
{w:2,q:"Seq2Seq 모델에서 인코더가 최종적으로 출력하는 '문맥 벡터(context vector)'의 역할은? [2주차]",c:["디코더의 학습률을 동적으로 조절하는 기준값이다.","입력 시퀀스 전체의 의미를 압축하여 디코더의 초기 상태로 전달한다.","인코더 각 시점의 출력을 개별적으로 저장하는 메모리이다.","출력 시퀀스의 길이를 결정하는 파라미터이다."],a:1},
{w:2,q:"기울기 폭발(Exploding Gradient) 문제를 해결하기 위해 일반적으로 사용하는 기법은? [2주차]",c:["학습률을 0에 가깝게 줄인다.","기울기 클리핑(Gradient Clipping)으로 기울기의 최대값을 제한한다.","활성화 함수를 제거하여 선형 모델로 만든다.","배치 크기를 1로 설정하여 확률적 경사하강법을 사용한다."],a:1},

// ===== 3주차 (10문항) =====
{w:3,q:"CNN에서 컨볼루션 연산을 수행한 결과물인 '특징 맵(feature map)'이 의미하는 것은? [3주차]",c:["원본 이미지를 축소한 썸네일 이미지","필터가 입력의 특정 패턴(엣지, 질감 등)에 반응한 정도를 나타내는 2D 맵","모든 픽셀의 평균값을 담은 1D 벡터","학습된 필터의 가중치를 시각화한 행렬"],a:1},
{w:3,q:"Max Pooling과 Average Pooling의 특성 차이에 대한 설명으로 가장 적절한 것은? [3주차]",c:["Max Pooling은 이미지를 확대하고, Average Pooling은 이미지를 축소한다.","Max Pooling은 영역 내 가장 강한 특징을 보존하고, Average Pooling은 영역의 평균적인 특징을 유지한다.","Max Pooling은 학습 가능한 파라미터가 있고, Average Pooling은 파라미터가 없다.","Max Pooling은 분류에만, Average Pooling은 세분화(segmentation)에만 사용된다."],a:1},
{w:3,q:"CNN에서 깊은 층(deep layer)으로 갈수록 학습하는 특징의 변화를 올바르게 설명한 것은? [3주차]",c:["모든 층에서 동일한 수준의 특징을 반복 학습한다.","얕은 층에서는 엣지·코너 같은 저수준 특징을, 깊은 층에서는 객체의 부분이나 전체 같은 고수준 특징을 학습한다.","얕은 층에서 고수준 특징을, 깊은 층에서 저수준 특징을 학습한다.","특징의 수준은 층의 깊이가 아니라 필터의 크기에만 의존한다."],a:1},
{w:3,q:"딥러닝에서 비선형 활성화 함수를 사용하지 않으면 발생하는 문제는? [3주차]",c:["역전파가 불가능해진다.","여러 층을 쌓아도 결국 단일 선형 변환과 동일해져 복잡한 패턴을 학습할 수 없다.","학습 속도가 극단적으로 빨라져 수렴하지 못한다.","출력값이 항상 0 또는 1로만 제한된다."],a:1},
{w:3,q:"CNN에서 스트라이드(stride)를 2로 설정했을 때의 효과로 가장 적절한 것은? [3주차]",c:["필터의 가중치가 2배로 증가한다.","출력 특징 맵의 공간 크기가 약 절반으로 줄어든다.","입력 이미지의 해상도가 2배로 증가한다.","필터가 입력의 2개 채널만 처리한다."],a:1},
{w:3,q:"Dropout이 과적합을 방지하는 메커니즘으로 가장 정확한 것은? [3주차]",c:["학습 데이터의 양을 자동으로 증가시킨다.","학습 시 무작위로 일부 뉴런을 비활성화하여 특정 뉴런에 대한 의존을 줄이고 일반화 능력을 높인다.","손실 함수의 값을 인위적으로 낮추어 빠른 수렴을 유도한다.","가중치를 일정 비율로 감쇠시켜 모델의 복잡도를 줄인다."],a:1},
{w:3,q:"Cross-Entropy Loss가 분류 문제에서 사용되는 이유로 가장 적절한 것은? [3주차]",c:["회귀 문제에서 MSE보다 수렴 속도가 빠르기 때문에","예측 확률 분포와 실제 레이블 분포 간의 차이를 효과적으로 측정하여 분류 정확도를 높이기 때문에","모델의 파라미터 수를 줄여주기 때문에","활성화 함수의 기울기 소실을 방지해주기 때문에"],a:1},
{w:3,q:"딥러닝에서 '특징 추출(feature extraction)'과 '다운스트림 작업(downstream task)'이 분리된다는 것의 의미는? [3주차]",c:["특징 추출과 분류가 항상 같은 네트워크에서 동시에 수행된다.","먼저 데이터에서 유의미한 표현을 추출하고, 그 표현을 별도의 분류·예측 등의 작업에 활용한다.","다운스트림 작업이 완료된 후 특징 추출이 시작된다.","특징 추출은 비지도학습으로만, 다운스트림 작업은 지도학습으로만 수행된다."],a:1},
{w:3,q:"패딩(padding)을 컨볼루션 연산에 적용하는 주된 이유는? [3주차]",c:["입력 데이터의 노이즈를 제거하기 위해","출력 특징 맵의 크기를 입력과 동일하게 유지하고, 가장자리 정보의 손실을 방지하기 위해","필터의 학습 속도를 높이기 위해","Max Pooling의 효과를 대체하기 위해"],a:1},
{w:3,q:"경사 하강법(Gradient Descent)에서 학습률(learning rate)이 너무 클 경우 발생하는 문제는? [3주차]",c:["학습이 너무 느려져 수렴하지 못한다.","최솟값을 지나쳐 발산하거나 진동하여 수렴하지 못한다.","기울기가 항상 0이 되어 학습이 멈춘다.","과적합이 발생하여 일반화 성능이 떨어진다."],a:1},

// ===== 4주차 (10문항) =====
{w:4,q:"트랜스포머에서 위치 인코딩(Positional Encoding)이 필요한 이유는? [4주차]",c:["어텐션 메커니즘의 계산 속도를 높이기 위해","Self-Attention은 입력 순서를 고려하지 않으므로, 토큰의 위치 정보를 명시적으로 제공하기 위해","인코더와 디코더 사이의 정보 전달을 위해","단어 임베딩의 차원을 줄이기 위해"],a:1},
{w:4,q:"Self-Attention에서 Query, Key, Value의 역할을 올바르게 설명한 것은? [4주차]",c:["Query는 참조할 정보, Key는 찾고자 하는 정보, Value는 유사도 점수이다.","Query는 현재 토큰의 질의, Key는 다른 토큰과의 관련도를 비교하는 기준, Value는 실제로 전달될 정보이다.","Query, Key, Value 모두 동일한 벡터이며 역할 구분이 없다.","Query는 인코더에서, Key와 Value는 디코더에서만 생성된다."],a:1},
{w:4,q:"Scaled Dot-Product Attention에서 유사도 점수를 √dk로 나누는 이유는? [4주차]",c:["행렬 연산의 속도를 높이기 위해","Query와 Key의 차원이 클 때 내적 값이 지나치게 커져 Softmax 출력이 극단화되는 것을 방지하기 위해","정규화를 통해 음수 값을 제거하기 위해","멀티 헤드 어텐션의 헤드 수와 일치시키기 위해"],a:1},
{w:4,q:"트랜스포머 디코더에서 Masked Self-Attention을 사용하는 이유는? [4주차]",c:["인코더의 출력을 참조하지 않기 위해","학습 시 미래 시점의 토큰 정보를 참조하지 못하도록 하여 자기 회귀적(autoregressive) 생성을 보장하기 위해","어텐션 계산의 메모리 사용량을 줄이기 위해","특정 단어를 마스킹하여 빈칸 채우기 학습을 수행하기 위해"],a:1},
{w:4,q:"트랜스포머에서 잔차 연결(Residual Connection)과 층 정규화(Layer Normalization)를 함께 사용하는 이유는? [4주차]",c:["모델의 파라미터 수를 줄이기 위해","깊은 네트워크에서 기울기 흐름을 안정화하고 학습을 원활하게 하기 위해","어텐션 점수의 합을 1로 만들기 위해","인코더와 디코더의 차원을 일치시키기 위해"],a:1},
{w:4,q:"트랜스포머가 RNN 대비 학습 속도에서 우위를 갖는 가장 핵심적인 이유는? [4주차]",c:["파라미터 수가 RNN보다 적기 때문에","Self-Attention은 모든 위치를 동시에 처리할 수 있어 병렬 연산이 가능하기 때문에","트랜스포머는 역전파를 사용하지 않기 때문에","RNN은 GPU에서 실행할 수 없기 때문에"],a:1},
{w:4,q:"워드 임베딩이 One-hot 인코딩에 비해 갖는 가장 큰 장점은? [4주차]",c:["메모리 사용량이 One-hot 인코딩보다 항상 크다.","저차원의 밀집 벡터(dense vector)로 단어 간 의미적 유사도를 반영할 수 있다.","학습 없이 규칙 기반으로 벡터를 생성할 수 있다.","모든 단어가 동일한 벡터로 표현되어 공정한 비교가 가능하다."],a:1},
{w:4,q:"트랜스포머의 피드 포워드 네트워크(FFN)가 각 위치에서 독립적으로 적용되는 이유는? [4주차]",c:["다른 위치의 정보를 참조해야 하기 때문에","Self-Attention이 이미 위치 간 관계를 학습했으므로, FFN은 각 위치의 표현을 개별적으로 변환하는 역할을 하기 때문에","병렬 처리가 불가능하게 만들기 위해","인코더와 디코더의 차원을 맞추기 위해"],a:1},
{w:4,q:"인코더-디코더 어텐션(Encoder-Decoder Attention)에서 Query, Key, Value의 출처가 올바르게 짝지어진 것은? [4주차]",c:["Query=인코더, Key=디코더, Value=디코더","Query=디코더, Key=인코더, Value=인코더","Query=인코더, Key=인코더, Value=디코더","Query, Key, Value 모두 디코더에서 생성된다."],a:1},
{w:4,q:"Softmax 함수가 어텐션 메커니즘에서 수행하는 역할은? [4주차]",c:["음수 값을 0으로 변환하여 활성화한다.","유사도 점수를 합이 1인 확률 분포로 변환하여 각 위치에 대한 가중치를 생성한다.","벡터의 차원을 축소한다.","기울기 소실을 방지한다."],a:1},

// ===== 5주차 (10문항) =====
{w:5,q:"ViT에서 이미지를 패치(patch)로 분할한 후 선형 프로젝션(Linear Projection)을 수행하는 이유는? [5주차]",c:["이미지의 해상도를 높이기 위해","각 패치를 트랜스포머가 처리할 수 있는 고정 차원의 토큰 벡터로 변환하기 위해","컨볼루션 연산을 대체하여 엣지를 검출하기 위해","패치 간 순서를 부여하기 위해"],a:1},
{w:5,q:"ViT에서 [CLS] 토큰의 역할은 무엇인가? [5주차]",c:["이미지의 마지막 패치를 나타낸다.","모든 패치의 정보를 집약하여 최종 분류에 사용되는 전역적 표현(global representation)을 제공한다.","위치 정보를 인코딩하는 특수 토큰이다.","패치 간 구분자 역할을 한다."],a:1},
{w:5,q:"ViT가 CNN에 비해 inductive bias(귀납적 편향)가 적다는 것은 어떤 의미인가? [5주차]",c:["ViT는 CNN보다 파라미터 수가 적다.","CNN은 국소성(locality)·이동 불변성 등의 사전 가정을 구조에 내재하지만, ViT는 이런 가정 없이 데이터로부터 패턴을 학습한다.","ViT는 항상 CNN보다 정확도가 높다.","CNN은 대규모 데이터가 필요하지만 ViT는 소량 데이터로도 충분하다."],a:1},
{w:5,q:"U-Net에서 Skip Connection(스킵 연결)이 중요한 이유는? [5주차]",c:["학습 시간을 단축하기 위해","인코더의 고해상도 공간 정보를 디코더에 직접 전달하여 세밀한 경계 정보를 복원하기 위해","모델의 파라미터 수를 줄이기 위해","풀링 레이어의 효과를 무효화하기 위해"],a:1},
{w:5,q:"ViT가 대규모 데이터셋에서 학습해야 좋은 성능을 보이는 이유로 가장 적절한 것은? [5주차]",c:["ViT의 파라미터 수가 CNN보다 항상 적기 때문에","CNN과 달리 국소성·이동 불변성 등의 inductive bias가 없어서, 데이터 자체에서 이러한 패턴을 학습해야 하기 때문에","ViT는 GPU에서만 학습 가능하기 때문에","대규모 데이터가 있으면 어텐션 메커니즘이 비활성화되기 때문에"],a:1},
{w:5,q:"U-Net의 인코더 경로(수축 경로)에서 수행되는 주된 작업은? [5주차]",c:["이미지의 해상도를 점진적으로 높이며 세밀한 특징을 복원한다.","컨볼루션과 풀링을 통해 이미지의 공간 크기를 줄이면서 추상적인 특징을 추출한다.","어텐션 메커니즘으로 전역적 관계를 학습한다.","노이즈를 점진적으로 추가한다."],a:1},
{w:5,q:"ViT에서 position embedding의 학습 방식에 대한 설명으로 옳은 것은? [5주차]",c:["트랜스포머 원문처럼 sin/cos 함수로 고정된 위치 인코딩을 사용한다.","학습 가능한(learnable) 파라미터로 위치 정보를 학습한다.","위치 정보는 사용하지 않고 패치 순서로만 대체한다.","CNN의 공간 정보를 그대로 가져와 사용한다."],a:1},
{w:5,q:"U-Net의 디코더 경로(확장 경로)에서 업샘플링(upsampling)을 수행하는 목적은? [5주차]",c:["특징 맵의 채널 수를 늘리기 위해","축소된 특징 맵의 공간 해상도를 원래 입력 크기로 복원하기 위해","학습률을 동적으로 조절하기 위해","노이즈를 제거하기 위해"],a:1},
{w:5,q:"ViT를 이미지 분류에 사용할 때, 최종 분류 결과를 도출하는 방법은? [5주차]",c:["모든 패치 토큰의 출력을 평균하여 분류기에 입력한다.","[CLS] 토큰의 최종 출력을 MLP 분류 헤드에 통과시킨다.","마지막 패치 토큰의 출력만 사용한다.","어텐션 가중치의 합을 분류 점수로 사용한다."],a:1},
{w:5,q:"U-Net이 의료 영상 세분화(segmentation)에 특히 적합한 이유는? [5주차]",c:["모델의 파라미터 수가 매우 적어 학습이 빠르기 때문에","Skip Connection을 통해 미세한 경계 정보를 보존하면서 의미적 특징도 활용할 수 있기 때문에","어텐션 메커니즘을 사용하여 전역적 관계를 학습하기 때문에","비지도학습으로 레이블 없이도 학습 가능하기 때문에"],a:1},

// ===== 6주차 (10문항) =====
{w:6,q:"GPT와 BERT의 구조적 차이점으로 가장 핵심적인 것은? [6주차]",c:["GPT는 CNN 기반이고, BERT는 RNN 기반이다.","GPT는 트랜스포머의 디코더만 사용하여 단방향으로 예측하고, BERT는 인코더만 사용하여 양방향으로 문맥을 이해한다.","GPT는 양방향이고, BERT는 단방향이다.","GPT는 이미지 생성에, BERT는 텍스트 생성에 특화되어 있다."],a:1},
{w:6,q:"RLHF(Reinforcement Learning from Human Feedback) 과정의 올바른 순서는? [6주차]",c:["미세조정 → 사전학습 → 보상 모델 학습 → 강화학습","사전학습 → 지도 미세조정(SFT) → 보상 모델 학습 → 강화학습(PPO) 최적화","강화학습 → 보상 모델 → 미세조정 → 사전학습","보상 모델 → 사전학습 → 강화학습 → 미세조정"],a:1},
{w:6,q:"GPT 모델의 자기 회귀적(autoregressive) 생성 방식이 의미하는 것은? [6주차]",c:["모든 토큰을 동시에 병렬적으로 생성한다.","이전에 생성된 토큰들을 조건으로 하여 다음 토큰을 하나씩 순차적으로 예측한다.","입력 문장의 일부를 무작위로 마스킹하고 복원한다.","양방향 문맥을 동시에 참조하여 토큰을 생성한다."],a:1},
{w:6,q:"Zero-shot learning과 Few-shot learning의 차이를 올바르게 설명한 것은? [6주차]",c:["Zero-shot은 대규모 데이터로 학습하고, Few-shot은 소량 데이터로 학습한다.","Zero-shot은 예시 없이 과제 설명만으로 수행하고, Few-shot은 소수의 예시를 프롬프트에 포함하여 수행한다.","Zero-shot은 미세조정이 필요하고, Few-shot은 미세조정이 불필요하다.","Zero-shot과 Few-shot은 동일한 방식이며 명칭만 다르다."],a:1},
{w:6,q:"BERT의 사전학습에서 Next Sentence Prediction(NSP) 태스크의 목적은? [6주차]",c:["문장 내 단어의 순서를 예측하기 위해","두 문장 간의 관계(연속 여부)를 이해하도록 모델을 학습시키기 위해","문장의 감정을 분류하기 위해","문장을 다른 언어로 번역하기 위해"],a:1},
{w:6,q:"텍스트 생성 시 '온도(Temperature)' 파라미터가 높을 때의 효과는? [6주차]",c:["출력이 더 결정적(deterministic)이고 반복적이 된다.","Softmax 분포가 더 균일해져 다양하고 창의적인 텍스트가 생성되지만 일관성이 낮아질 수 있다.","모델의 학습 속도가 빨라진다.","생성되는 토큰의 길이가 짧아진다."],a:1},
{w:6,q:"사전학습(Pre-training)과 미세조정(Fine-tuning)의 관계를 올바르게 설명한 것은? [6주차]",c:["사전학습은 특정 작업을 위한 학습이고, 미세조정은 범용적 학습이다.","사전학습에서 대규모 데이터로 일반적 언어 지식을 학습한 후, 미세조정에서 특정 다운스트림 태스크에 맞게 파라미터를 조정한다.","사전학습과 미세조정은 동시에 수행되며 구분이 없다.","미세조정이 완료된 후 사전학습을 수행한다."],a:1},
{w:6,q:"GPT 모델에서 '환각(Hallucination)' 현상을 완화하기 위한 기술적 접근으로 적절하지 않은 것은? [6주차]",c:["검색 증강 생성(RAG)을 통해 외부 지식을 참조하게 한다.","RLHF를 통해 사실 정보에 기반한 응답을 강화한다.","모델의 파라미터 수를 줄여 단순화한다.","Chain-of-Thought 프롬프팅으로 추론 과정을 명시하게 한다."],a:2},
{w:6,q:"BERT에서 Masked Language Model(MLM) 학습 시 입력 토큰의 약 15%를 마스킹하는 이유는? [6주차]",c:["계산 비용을 줄이기 위해","너무 많은 토큰을 마스킹하면 문맥 정보가 부족해지고, 너무 적으면 학습 효율이 낮아지는 균형을 맞추기 위해","출력 시퀀스의 길이를 15%로 제한하기 위해","BERT의 어텐션 헤드 수와 일치시키기 위해"],a:1},
{w:6,q:"전이학습(Transfer Learning)에서 '다운스트림 태스크'의 의미로 가장 적절한 것은? [6주차]",c:["사전학습 이전에 수행하는 데이터 전처리 작업","사전학습된 모델을 활용하여 수행하는 구체적인 목표 작업(감정 분석, 질의응답 등)","모델의 파라미터를 초기화하는 작업","대규모 비지도학습을 수행하는 작업"],a:1},

// ===== 7주차 (10문항) =====
{w:7,q:"GAN의 학습 과정을 min-max 게임으로 표현할 때, 생성기(G)와 판별기(D)의 목표를 올바르게 설명한 것은? [7주차]",c:["G와 D 모두 동일한 손실 함수를 최소화한다.","G는 D가 가짜 데이터를 진짜로 판단하도록 속이고, D는 진짜와 가짜 데이터를 정확히 구별하려 한다.","G는 손실을 최대화하고, D는 데이터의 품질을 향상시킨다.","G는 D의 가중치를 직접 수정하고, D는 G의 출력을 증폭시킨다."],a:1},
{w:7,q:"GAN 학습에서 '모드 붕괴(Mode Collapse)'가 발생하면 나타나는 구체적인 현상은? [7주차]",c:["판별기의 정확도가 0%로 떨어진다.","생성기가 데이터 분포의 일부 모드만 학습하여 다양성이 극도로 제한된 유사한 출력만 반복 생성한다.","학습 손실이 무한대로 발산한다.","생성기와 판별기가 동시에 학습을 멈춘다."],a:1},
{w:7,q:"DCGAN에서 기존 GAN 대비 도입된 주요 구조적 개선 사항이 아닌 것은? [7주차]",c:["완전 연결 층(Fully Connected Layer) 대신 컨볼루션 층 사용","배치 정규화(Batch Normalization) 적용","풀링(Pooling) 층을 스트라이드 컨볼루션으로 대체","어텐션 메커니즘 도입"],a:3},
{w:7,q:"GAN에서 생성기(Generator)가 잠재 벡터 z로부터 이미지를 생성할 때, z는 일반적으로 어떤 분포에서 샘플링되는가? [7주차]",c:["균일 분포(Uniform Distribution)만 사용된다.","가우시안(정규) 분포에서 무작위로 샘플링된다.","학습된 사후 분포(posterior distribution)에서 샘플링된다.","이산 분포(Discrete Distribution)에서 샘플링된다."],a:1},
{w:7,q:"Conditional GAN이 기본 GAN과 다른 점으로 가장 핵심적인 것은? [7주차]",c:["판별기를 사용하지 않는다.","생성기와 판별기 모두에 조건 정보(레이블, 텍스트 등)를 추가 입력하여 원하는 종류의 데이터를 생성할 수 있다.","잠재 벡터를 사용하지 않는다.","적대적 학습 대신 협력적 학습을 수행한다."],a:1},
{w:7,q:"GAN 학습이 불안정한 근본적인 이유로 가장 적절한 것은? [7주차]",c:["데이터셋의 크기가 항상 부족하기 때문에","생성기와 판별기의 학습 균형을 유지하기 어렵고, 한쪽이 지나치게 우세해지면 다른 쪽의 기울기가 유용한 정보를 제공하지 못하기 때문에","GPU 메모리 부족 때문에","손실 함수가 미분 불가능하기 때문에"],a:1},
{w:7,q:"GAN에서 판별기(D)의 출력이 D(x) ≈ 0.5에 수렴하는 것의 의미는? [7주차]",c:["판별기가 과적합되었다는 의미이다.","생성기가 실제 데이터와 구별할 수 없는 수준의 데이터를 생성하여 판별기가 진짜와 가짜를 구분하지 못하는 Nash 균형 상태에 도달했다.","판별기의 학습이 완전히 실패했다.","모드 붕괴가 발생했다."],a:1},
{w:7,q:"GAN에서 생성기의 역할에 대한 설명으로 옳은 것은? [7주차]",c:["실제 데이터와 생성 데이터를 비교하여 점수를 매긴다.","잠재 공간의 랜덤 벡터를 입력받아 실제 데이터 분포와 유사한 새로운 데이터를 생성한다.","입력 데이터의 특징을 추출하여 분류한다.","손실 함수의 기울기를 직접 계산한다."],a:1},
{w:7,q:"Pix2Pix와 CycleGAN의 핵심 차이점은? [7주차]",c:["Pix2Pix는 GAN이 아니고 CycleGAN만 GAN이다.","Pix2Pix는 쌍(pair)을 이룬 학습 데이터가 필요하지만, CycleGAN은 쌍을 이루지 않은 데이터로도 학습할 수 있다.","Pix2Pix는 이미지만, CycleGAN은 텍스트만 처리한다.","Pix2Pix는 판별기가 2개이고, CycleGAN은 판별기가 1개이다."],a:1},
{w:7,q:"GAN의 생성기에서 전치 컨볼루션(Transposed Convolution)을 사용하는 이유는? [7주차]",c:["이미지의 해상도를 줄이기 위해","저차원의 잠재 벡터로부터 점진적으로 공간 크기를 키워 고해상도 이미지를 생성하기 위해","과적합을 방지하기 위해","배치 정규화를 대체하기 위해"],a:1},

// ===== 9주차 (10문항) =====
{w:9,q:"StyleGAN에서 매핑 네트워크(Mapping Network)가 잠재 벡터 z를 중간 잠재 공간 W로 변환하는 이유는? [9주차]",c:["모델의 파라미터 수를 줄이기 위해","잠재 공간의 얽힘(entanglement)을 해소하여 각 스타일 속성을 독립적으로 제어할 수 있게 하기 위해","이미지의 해상도를 높이기 위해","판별기의 학습을 가속하기 위해"],a:1},
{w:9,q:"StyleGAN에서 AdaIN(Adaptive Instance Normalization)의 역할은? [9주차]",c:["이미지의 노이즈를 제거한다.","스타일 벡터의 정보를 각 컨볼루션 레이어에 주입하여 생성 이미지의 스타일을 조절한다.","이미지를 패치로 분할한다.","판별기의 출력을 정규화한다."],a:1},
{w:9,q:"뉴런 스타일 전송(Neural Style Transfer)에서 콘텐츠 손실(content loss)과 스타일 손실(style loss)의 차이는? [9주차]",c:["콘텐츠 손실은 색상 차이를, 스타일 손실은 크기 차이를 측정한다.","콘텐츠 손실은 생성 이미지가 원본의 구조·배치를 유지하도록 하고, 스타일 손실은 참조 이미지의 질감·색조·패턴을 반영하도록 한다.","콘텐츠 손실과 스타일 손실은 동일한 것으로 명칭만 다르다.","콘텐츠 손실은 얕은 층에서, 스타일 손실은 깊은 층에서만 계산된다."],a:1},
{w:9,q:"CycleGAN의 순환 일관성 손실(Cycle Consistency Loss)이 보장하는 것은? [9주차]",c:["생성 이미지의 해상도가 원본과 동일하다.","이미지를 A→B 도메인으로 변환한 후 다시 B→A로 변환하면 원래 이미지와 유사해야 한다.","판별기의 정확도가 100%가 되어야 한다.","두 도메인의 이미지가 반드시 쌍(pair)을 이루어야 한다."],a:1},
{w:9,q:"DCGAN에서 풀링(Pooling) 레이어를 스트라이드 컨볼루션(Strided Convolution)으로 대체한 이유는? [9주차]",c:["이미지의 해상도를 높이기 위해","공간 축소를 학습 가능한(learnable) 방식으로 수행하여 생성 품질을 향상시키기 위해","메모리 사용량을 증가시키기 위해","배치 정규화를 적용할 수 없기 때문에"],a:1},
{w:9,q:"FID(Fréchet Inception Distance) 점수에 대한 설명으로 올바른 것은? [9주차]",c:["점수가 높을수록 생성 이미지의 품질이 좋다.","생성 이미지와 실제 이미지의 특징 분포 간 거리를 측정하며, 낮을수록 품질이 좋다.","개별 이미지의 해상도만 평가한다.","텍스트와 이미지의 일치도를 측정한다."],a:1},
{w:9,q:"StyleGAN에서 스타일 혼합(Style Mixing)을 학습에 사용하면 얻을 수 있는 효과는? [9주차]",c:["학습 속도가 빨라진다.","특정 레이어가 특정 스타일 속성에 대응하도록 학습되어 인접 스타일의 상관관계가 줄어든다.","판별기의 성능이 저하된다.","모든 이미지가 동일한 스타일로 생성된다."],a:1},
{w:9,q:"뉴런 스타일 전송에서 스타일 손실을 계산할 때 Gram Matrix를 사용하는 이유는? [9주차]",c:["이미지의 전체 구조를 보존하기 위해","특징 맵 간의 상관관계를 통해 질감·패턴 등 스타일 정보를 포착할 수 있기 때문에","이미지의 색상 히스토그램을 일치시키기 위해","컨볼루션 연산의 효율을 높이기 위해"],a:1},
{w:9,q:"CycleGAN에 생성기가 2개, 판별기가 2개 필요한 이유는? [9주차]",c:["하나는 학습용, 하나는 테스트용이다.","A→B 변환과 B→A 변환을 각각 담당하고, 각 도메인의 진위를 판별해야 하기 때문에","병렬 학습으로 속도를 높이기 위해","생성기 하나로는 이미지 해상도가 부족하기 때문에"],a:1},
{w:9,q:"StyleGAN에서 Truncation Trick의 효과는? [9주차]",c:["학습 데이터의 양을 줄인다.","잠재 벡터의 분포를 평균 쪽으로 제한하여 품질은 높이되 다양성은 다소 줄인다.","모델의 파라미터 수를 줄인다.","판별기의 학습을 중단시킨다."],a:1},

// ===== 10주차 (10문항) =====
{w:10,q:"이미지 캡션(Image Captioning) 시스템에서 인코더와 디코더의 역할을 올바르게 짝지은 것은? [10주차]",c:["인코더(RNN)가 텍스트를 인식하고, 디코더(CNN)가 이미지를 생성한다.","인코더(CNN)가 이미지에서 시각적 특징을 추출하고, 디코더(RNN/Transformer)가 특징을 기반으로 텍스트를 생성한다.","인코더와 디코더 모두 CNN을 사용한다.","인코더는 불필요하며 디코더만으로 캡션을 생성한다."],a:1},
{w:10,q:"이미지 캡션 생성에서 어텐션 메커니즘이 도입된 주된 이유는? [10주차]",c:["이미지의 해상도를 높이기 위해","디코더가 각 단어를 생성할 때 이미지의 관련 영역에 선택적으로 집중할 수 있게 하기 위해","인코더의 파라미터 수를 줄이기 위해","학습 데이터의 양을 늘리기 위해"],a:1},
{w:10,q:"레이어 평탄화(Flatten)가 CNN과 분류기 사이에서 수행하는 역할은? [10주차]",c:["특징 맵의 해상도를 높인다.","다차원 특징 맵을 1차원 벡터로 변환하여 완전 연결 층(FC Layer)에 입력할 수 있게 한다.","특징 맵에서 노이즈를 제거한다.","배치 정규화를 수행한다."],a:1},
{w:10,q:"Beam Search가 Greedy Decoding보다 캡션 생성 품질이 높은 이유는? [10주차]",c:["항상 가장 확률이 높은 단어 하나만 선택하기 때문에","여러 개의 후보 시퀀스를 동시에 유지하면서 전체 시퀀스의 확률을 고려하여 최적의 결과를 찾기 때문에","학습 시간이 더 짧기 때문에","어텐션 메커니즘을 사용하지 않기 때문에"],a:1},
{w:10,q:"BLEU 점수가 이미지 캡션 평가에 사용될 때 측정하는 것은? [10주차]",c:["생성 이미지의 해상도","생성된 캡션과 참조 캡션 간의 n-gram 겹침(overlap) 정도","이미지의 분류 정확도","모델의 학습 속도"],a:1},
{w:10,q:"인코더-디코더 구조에서 '잠재 표현(latent representation)'이 중요한 이유는? [10주차]",c:["원본 데이터를 손실 없이 완벽하게 복원하기 위해","입력 데이터의 핵심 정보를 압축된 형태로 담아 다양한 하위 작업에 활용할 수 있기 때문에","데이터의 크기를 늘려 학습 효율을 높이기 위해","정규화를 수행하기 위해"],a:1},
{w:10,q:"이미지 캡션에서 Teacher Forcing 기법의 의미는? [10주차]",c:["교사가 직접 캡션을 작성하는 것","학습 시 디코더의 이전 출력 대신 실제 정답 토큰을 다음 입력으로 사용하여 학습을 안정화하는 기법","테스트 시에만 사용되는 기법","인코더의 학습을 강제로 중단하는 기법"],a:1},
{w:10,q:"Visual Question Answering(VQA) 태스크가 이미지 캡션과 다른 점은? [10주차]",c:["이미지 없이 텍스트만으로 수행한다.","이미지와 함께 자연어 질문이 주어지고, 모델이 그에 맞는 답변을 생성하는 점에서 다중 모달(multi-modal) 이해가 필요하다.","VQA는 비지도학습으로만 학습된다.","VQA와 이미지 캡션은 동일한 태스크이다."],a:1},
{w:10,q:"이미지 캡션에서 CNN 인코더로 주로 사용되는 사전학습 모델의 종류는? [10주차]",c:["GPT, BERT 등 언어 모델","ResNet, VGG, Inception 등 ImageNet으로 사전학습된 분류 모델","GAN의 생성기","Diffusion 모델의 노이즈 예측기"],a:1},
{w:10,q:"이미지 캡션 생성 시 '문맥(context)'이라는 용어가 의미하는 것은? [10주차]",c:["이미지 파일의 메타데이터","인코더가 추출한 이미지의 시각적 정보를 압축한 표현으로, 디코더가 텍스트를 생성하는 데 참고하는 정보","학습 데이터의 통계적 분포","디코더의 은닉 상태 초기값"],a:1},

// ===== 11주차 (10문항) =====
{w:11,q:"Diffusion 모델에서 순방향(Forward) 프로세스와 역방향(Reverse) 프로세스의 차이를 올바르게 설명한 것은? [11주차]",c:["순방향은 노이즈를 제거하고, 역방향은 노이즈를 추가한다.","순방향은 원본 데이터에 점진적으로 노이즈를 추가하고, 역방향은 노이즈로부터 점진적으로 원본을 복원한다.","순방향과 역방향 모두 동일한 과정이다.","순방향은 학습에만, 역방향은 추론에만 사용되며 구조가 완전히 다르다."],a:1},
{w:11,q:"PSNR(Peak Signal-to-Noise Ratio)과 SSIM(Structural Similarity Index)의 차이를 올바르게 설명한 것은? [11주차]",c:["PSNR은 구조적 유사성을, SSIM은 신호 대 잡음비를 측정한다.","PSNR은 픽셀 단위의 오차를 기반으로 하고, SSIM은 밝기·대비·구조의 유사성을 종합적으로 평가한다.","PSNR과 SSIM 모두 높을수록 품질이 나쁘다.","PSNR은 생성 이미지에만, SSIM은 실제 이미지에만 적용 가능하다."],a:1},
{w:11,q:"DALL-E 모델에서 텍스트와 이미지 토큰을 '자동 회귀적(autoregressive)'으로 모델링한다는 것의 의미는? [11주차]",c:["텍스트와 이미지를 별도의 네트워크에서 독립적으로 처리한다.","텍스트 토큰 뒤에 이미지 토큰을 이어 붙여 하나의 시퀀스로 만들고, 이전 토큰들을 조건으로 다음 토큰을 순차 예측한다.","이미지 토큰을 먼저 생성한 후 텍스트를 역순으로 생성한다.","모든 토큰을 동시에 병렬적으로 생성한다."],a:1},
{w:11,q:"적대적 손실(Adversarial Loss)이 영상 생성에서 사용되는 이유는? [11주차]",c:["픽셀 단위의 정확한 복원을 위해","생성 이미지가 실제 이미지와 구별할 수 없도록 판별기와 경쟁하여 사실감을 높이기 위해","학습 속도를 가속시키기 위해","노이즈를 제거하기 위해"],a:1},
{w:11,q:"Diffusion 모델의 한계점 중 '긴 추론 시간'이 발생하는 이유는? [11주차]",c:["모델의 파라미터 수가 적어서","순수 노이즈에서 시작하여 수십~수백 단계에 걸쳐 점진적으로 노이즈를 제거해야 이미지가 생성되기 때문에","GAN 대비 판별기 연산이 추가되기 때문에","텍스트 인코딩에 시간이 오래 걸리기 때문에"],a:1},
{w:11,q:"지각 손실(Perceptual Loss)이 픽셀 단위 손실(Pixel-wise Loss) 대비 갖는 장점은? [11주차]",c:["계산 비용이 더 저렴하다.","사전학습된 네트워크의 특징 공간에서 유사성을 비교하여 인간의 시각적 인지와 더 부합하는 결과를 만든다.","픽셀 단위 정확도가 더 높다.","어떤 네트워크에서도 동일한 결과를 보장한다."],a:1},
{w:11,q:"영상 생성 모델의 성능 평가에서 FID 점수가 IS(Inception Score)보다 선호되는 이유는? [11주차]",c:["IS는 생성 이미지만 평가하지만, FID는 생성 이미지와 실제 이미지 분포 사이의 거리를 측정하여 더 포괄적이기 때문에","FID는 계산이 더 간단하기 때문에","IS는 GAN에서만 사용 가능하기 때문에","FID는 항상 0~1 사이의 값을 가지기 때문에"],a:0},
{w:11,q:"SSIM(Structural Similarity Index)에서 값이 1에 가까울수록 의미하는 것은? [11주차]",c:["두 이미지의 유사성이 낮다.","두 이미지의 구조적 유사성이 매우 높다.","이미지의 노이즈가 많다.","이미지의 해상도가 낮다."],a:1},
{w:11,q:"쿨백-라이블러 발산(KL Divergence)이 영상 생성 모델에서 사용되는 맥락은? [11주차]",c:["생성 이미지의 해상도를 측정한다.","잠재 공간의 학습된 분포가 사전 정의된 분포(예: 표준 정규분포)와 얼마나 가까운지를 측정하여 정규화하는 데 사용된다.","판별기의 정확도를 평가한다.","텍스트와 이미지의 의미적 일치를 측정한다."],a:1},
{w:11,q:"Diffusion 모델에서 노이즈 스케줄링(Noise Scheduling)이 중요한 이유는? [11주차]",c:["모델의 파라미터 수를 조절하기 위해","각 시간 단계(timestep)에서 추가되는 노이즈의 양을 적절히 조절하여 학습 안정성과 생성 품질을 확보하기 위해","생성 이미지의 해상도를 결정하기 위해","텍스트 인코딩의 길이를 결정하기 위해"],a:1},

// ===== 12주차 (10문항) =====
{w:12,q:"CLIP(Contrastive Language-Image Pre-training) 모델의 학습 방식을 올바르게 설명한 것은? [12주차]",c:["이미지만을 사용하여 분류 학습을 수행한다.","텍스트-이미지 쌍을 대조적(contrastive)으로 학습하여 일치하는 쌍의 임베딩은 가깝게, 불일치하는 쌍은 멀게 만든다.","텍스트를 이미지로 직접 변환하는 생성 모델이다.","이미지의 픽셀 값을 텍스트 토큰으로 일대일 변환한다."],a:1},
{w:12,q:"DALL-E 2의 전체 파이프라인에서 Prior 모델이 수행하는 역할은? [12주차]",c:["텍스트를 토큰으로 분리한다.","CLIP 텍스트 임베딩을 CLIP 이미지 임베딩으로 변환하여 디코더가 이미지를 생성할 수 있게 한다.","생성 이미지의 해상도를 높인다.","판별기 역할을 수행한다."],a:1},
{w:12,q:"Stable Diffusion이 기존 Diffusion 모델 대비 효율적인 이유는? [12주차]",c:["이미지 픽셀 공간에서 직접 노이즈를 제거하기 때문에","오토인코더의 잠재 공간(latent space)에서 Diffusion 과정을 수행하여 계산량을 크게 줄이기 때문에","GAN 구조를 결합하여 단일 단계로 생성하기 때문에","텍스트 인코더를 사용하지 않기 때문에"],a:1},
{w:12,q:"Stable Diffusion에서 U-Net이 수행하는 구체적인 역할은? [12주차]",c:["텍스트를 이미지로 직접 변환한다.","잠재 공간에서 각 시간 단계의 노이즈를 예측하여 점진적으로 제거한다.","이미지를 잠재 공간으로 인코딩한다.","CLIP 텍스트 임베딩을 생성한다."],a:1},
{w:12,q:"DALL-E 2에서 텍스트 조건부 이미지 생성의 전체 흐름을 올바르게 나열한 것은? [12주차]",c:["이미지 인코더 → 텍스트 생성 → 판별기","CLIP 텍스트 인코더 → Prior → Diffusion 디코더 → 이미지 생성","GAN 생성기 → 판별기 → 이미지 출력","VAE 인코더 → 잠재 공간 샘플링 → VAE 디코더"],a:1},
{w:12,q:"이미지 인페인팅(Inpainting)과 아웃페인팅(Outpainting)의 차이는? [12주차]",c:["인페인팅은 이미지를 축소하고, 아웃페인팅은 이미지를 확대한다.","인페인팅은 이미지 내부의 지정 영역을 새로 생성하여 채우고, 아웃페인팅은 이미지의 경계 바깥을 확장하여 새로 생성한다.","인페인팅은 GAN으로, 아웃페인팅은 Diffusion으로만 가능하다.","인페인팅과 아웃페인팅은 동일한 기술이다."],a:1},
{w:12,q:"Classifier-free Guidance의 핵심 아이디어는? [12주차]",c:["별도의 분류기(classifier)를 학습하여 생성 과정을 안내한다.","조건부 생성과 무조건부 생성의 출력 차이를 증폭시켜 텍스트 조건에 더 충실한 이미지를 생성한다.","텍스트 조건 없이 이미지를 생성한다.","분류기의 기울기를 이용하여 노이즈 제거 방향을 조절한다."],a:1},
{w:12,q:"CLIP 모델이 텍스트-이미지 검색(retrieval)에 활용될 수 있는 이유는? [12주차]",c:["이미지를 텍스트로 직접 변환할 수 있기 때문에","텍스트와 이미지를 동일한 임베딩 공간에 매핑하여 코사인 유사도로 관련성을 비교할 수 있기 때문에","대량의 레이블 데이터로 지도학습을 수행했기 때문에","이미지의 픽셀 값을 직접 비교하기 때문에"],a:1},
{w:12,q:"DALL-E 2가 '이미지 변형(Image Variation)'을 수행할 수 있는 원리는? [12주차]",c:["원본 이미지를 GAN으로 복제한다.","원본 이미지의 CLIP 이미지 임베딩을 추출한 후 Diffusion 디코더로 새로운 이미지를 생성하여 의미는 유사하나 시각적으로 다른 변형을 만든다.","원본 이미지에 필터를 적용한다.","텍스트 없이 랜덤 노이즈만으로 생성한다."],a:1},
{w:12,q:"DALL-E 2의 기반 아키텍처가 GPT-3인 이유로 가장 적절한 것은? [12주차]",c:["GPT-3는 이미지 분류 모델이기 때문에","GPT-3의 대규모 트랜스포머 아키텍처가 텍스트-이미지 간 복잡한 관계를 학습하는 데 적합하기 때문에","GPT-3는 CNN 기반이기 때문에","GPT-3가 판별기 역할을 하기 때문에"],a:1},

// ===== 13주차 (10문항) =====
{w:13,q:"강화학습에서 MDP(Markov Decision Process)의 핵심 구성요소를 올바르게 나열한 것은? [13주차]",c:["입력 레이어, 은닉 레이어, 출력 레이어, 활성화 함수","상태(State), 행동(Action), 보상(Reward), 전이 확률(Transition Probability), 할인 인자(Discount Factor)","생성기, 판별기, 잠재 공간, 손실 함수","인코더, 디코더, 어텐션, 피드 포워드"],a:1},
{w:13,q:"가치 함수(Value Function)와 Q 함수(Q Function)의 차이를 올바르게 설명한 것은? [13주차]",c:["가치 함수와 Q 함수는 동일한 개념이다.","가치 함수는 특정 상태의 기대 보상을, Q 함수는 특정 상태에서 특정 행동을 취했을 때의 기대 보상을 나타낸다.","가치 함수는 행동을, Q 함수는 상태를 평가한다.","가치 함수는 모델 기반에서만, Q 함수는 모델 프리에서만 사용된다."],a:1},
{w:13,q:"Decision Transformer가 기존 강화학습 방법과 근본적으로 다른 점은? [13주차]",c:["실시간 환경 상호작용이 반드시 필요하다.","강화학습 문제를 시퀀스 모델링으로 재정의하여, 상태·행동·보상의 시퀀스를 조건으로 다음 행동을 예측한다.","Q-Learning 알고리즘을 사용한다.","판별기와 생성기의 적대적 학습을 수행한다."],a:1},
{w:13,q:"오프라인 강화학습(Offline RL)의 특징으로 올바른 것은? [13주차]",c:["에이전트가 환경과 실시간으로 상호작용하며 학습한다.","미리 수집된 데이터(dataset)만을 사용하여 정책을 학습하며, 학습 중 새로운 환경 탐색을 하지 않는다.","보상 함수를 사용하지 않는다.","지도학습과 동일한 방식이다."],a:1},
{w:13,q:"강화학습에서 할인 인자(discount factor, γ)가 0에 가까울 때의 효과는? [13주차]",c:["에이전트가 먼 미래의 보상을 더 중요시한다.","에이전트가 즉각적인 보상을 더 중요시하여 근시안적인 행동을 취한다.","학습이 불가능해진다.","모든 보상이 동일한 가중치를 갖는다."],a:1},
{w:13,q:"Decision Transformer에서 'Return-to-Go'의 역할은? [13주차]",c:["과거에 받은 총 보상을 기록한다.","현재 시점부터 목표 시점까지 받을 기대 누적 보상으로, 모델에 목표 성과 수준을 조건으로 부여한다.","에이전트의 현재 위치를 나타낸다.","환경의 전이 확률을 계산한다."],a:1},
{w:13,q:"정책 경사법(Policy Gradient)과 가치 기반 방법(Value-based Method)의 핵심 차이는? [13주차]",c:["정책 경사법은 보상을 사용하지 않는다.","정책 경사법은 정책을 직접 학습하여 연속 행동 공간에도 적용 가능하고, 가치 기반은 Q값 등을 학습하여 간접적으로 정책을 도출한다.","가치 기반 방법이 항상 더 좋은 성능을 보인다.","두 방법은 동일한 알고리즘이다."],a:1},
{w:13,q:"행동 복제(Behavior Cloning)의 한계점으로 가장 적절한 것은? [13주차]",c:["대규모 데이터가 필요하지 않다.","전문가 시연 데이터에만 의존하므로 학습 분포를 벗어난 상황에서 오류가 누적(compounding error)될 수 있다.","강화학습보다 항상 우수한 성능을 보인다.","실시간 환경 상호작용이 필요하다."],a:1},
{w:13,q:"트랜스포머를 강화학습에 적용할 때 Self-Attention이 기여하는 핵심 역할은? [13주차]",c:["환경의 물리적 시뮬레이션을 수행한다.","긴 시간 범위의 상태·행동·보상 간 의존 관계를 효과적으로 포착한다.","보상 함수를 자동으로 설계한다.","에이전트의 행동 공간을 축소한다."],a:1},
{w:13,q:"강화학습에서 '탐험(Exploration)'이 중요한 이유는? [13주차]",c:["이미 알고 있는 최적 행동만 반복하기 위해","초기에 알려지지 않은 상태·행동 조합을 시도하여 더 높은 보상을 발견할 가능성을 확보하기 위해","학습 속도를 늦추기 위해","보상 함수를 변경하기 위해"],a:1},

// ===== 14주차 (10문항) =====
{w:14,q:"BEV(Bird's Eye View) 표현을 카메라 이미지로부터 생성하는 핵심 기술적 과제는? [14주차]",c:["이미지의 색상을 보정하는 것","2D 원근 투영(perspective) 이미지를 3D 공간의 Top-down 뷰로 기하학적 변환하는 것","이미지의 해상도를 높이는 것","카메라의 노이즈를 제거하는 것"],a:1},
{w:14,q:"자율주행에서 센서 퓨전(Sensor Fusion)이 필요한 이유는? [14주차]",c:["단일 센서만으로 충분하지만 비용을 줄이기 위해","각 센서(카메라, 라이다, 레이더)의 장단점이 다르므로 상호 보완하여 더 정확하고 강건한 환경 인지를 수행하기 위해","센서 데이터의 저장 용량을 줄이기 위해","모든 센서가 동일한 정보를 제공하므로"],a:1},
{w:14,q:"ChauffeurNet에서 지도학습(Imitation Learning) 기반으로 주행을 학습할 때의 한계점은? [14주차]",c:["학습 속도가 매우 빠르다.","시연 데이터에 없는 위험 상황이나 비정상 시나리오에 대한 대처 능력이 부족할 수 있다.","비지도학습보다 데이터가 적게 필요하다.","실시간 추론이 불가능하다."],a:1},
{w:14,q:"BEVFormer에서 Spatial Attention과 Temporal Attention을 함께 사용하는 이유는? [14주차]",c:["이미지의 해상도를 높이기 위해","현재 시점의 다중 카메라 공간 정보(spatial)와 이전 시점의 시간적 정보(temporal)를 통합하여 동적 환경을 더 정확히 인지하기 위해","학습 파라미터 수를 줄이기 위해","단일 카메라만 사용하기 위해"],a:1},
{w:14,q:"자율주행 시스템의 일반적인 파이프라인에서 '인지(Perception) → 예측(Prediction) → 계획(Planning) → 제어(Control)' 순서의 의미는? [14주차]",c:["각 단계가 독립적으로 작동하며 순서가 없다.","환경을 인식하고, 다른 객체의 미래 움직임을 예측하며, 주행 경로를 계획하고, 실제 조향·가감속을 수행하는 단계적 의사결정 과정이다.","인지와 제어만 필요하고 예측과 계획은 불필요하다.","모든 단계를 하나의 신경망으로 통합해야 한다."],a:1},

// 변형 문제 id 부여
(function(){ const cnt={}; BANK_V.forEach(it=>{ cnt[it.w]=(cnt[it.w]||0)+1; it.id="v"+it.w+"q"+cnt[it.w]; it.n=cnt[it.w]; }); })();

/* ===================== localStorage ===================== */
const KEY = "genai_quiz_v1";
function loadStore(){ try { return JSON.parse(localStorage.getItem(KEY)) || {attempts:[]}; } catch(e){ return {attempts:[]}; } }
function saveStore(s){ localStorage.setItem(KEY, JSON.stringify(s)); }

/* ===================== helpers ===================== */
const $ = s => document.querySelector(s);
const weeks = [...new Set(BANK.map(b=>b.w))].sort((a,b)=>a-b);
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function scopeLabel(s){
  if(s==="all") return "전체 14주차";
  if(s==="vallV") return "변형 전체";
  if(s==="wrong") return "오답 노트";
  if(s==="vwrong") return "변형 오답 노트";
  if(s.startsWith("vw")) return "변형 "+s.replace("vw","")+"주차";
  return s.replace("w","")+"주차"+(s==="w8"?" (중간고사)":"");
}

/* ===================== state ===================== */
let session = null; // {scope, items[], idx, results[]}


/* ===================== variant (변형) ===================== */
const weeksV = [...new Set(BANK_V.map(b=>b.w))].sort((a,b)=>a-b);
let activeBank = "original"; // "original" or "variant"

function renderVariant(){
  const grid = $("#weekGridV"); grid.innerHTML="";
  weeksV.forEach(w=>{
    const count = BANK_V.filter(b=>b.w===w).length;
    const el = document.createElement("div");
    el.className = "chip"; el.dataset.scope = "vw"+w;
    el.innerHTML = `<div class="w">${w}주차</div><div class="c">${count}문항</div>`;
    el.onclick = ()=> startQuizV("vw"+w);
    grid.appendChild(el);
  });
  const store = loadStore();
  const wrongIds = collectWrongIds(store);
  const vWrongCount = [...wrongIds].filter(id=>id.startsWith("v")).length;
  $("#homeStatsV").innerHTML =
    `<div class="stat"><b>${BANK_V.length}</b>변형 문항</div>`+
    `<div class="stat"><b>${vWrongCount}</b>변형 오답 문항</div>`;
  $("#btnWrongOnlyV").disabled = vWrongCount===0;
}

function startQuizV(scope){
  activeBank = "variant";
  let pool;
  if(scope==="vallV") pool = BANK_V.slice();
  else if(scope==="vwrong"){
    const ids = collectWrongIds(loadStore());
    pool = BANK_V.filter(b=>ids.has(b.id));
    if(pool.length===0){ alert("변형 오답 노트가 비어 있습니다."); return; }
  } else {
    const w = parseInt(scope.replace("vw",""),10);
    pool = BANK_V.filter(b=>b.w===w);
  }
  if($("#optShuffleQV").checked) pool = shuffle(pool);
  const shuffleC = $("#optShuffleCV").checked;
  const items = pool.map(b=>{
    let order = b.c.map((_,i)=>i);
    if(shuffleC) order = shuffle(order);
    return { ref:b, order };
  });
  session = { scope, items, idx:0, results:[] };
  showView("quiz");
  renderQuestion();
}

$("#btnWrongOnlyV").onclick = ()=> startQuizV("vwrong");
$("#btnAllV").onclick = ()=> startQuizV("vallV");


/* ===================== render home ===================== */
function renderHome(){
  const grid = $("#weekGrid"); grid.innerHTML="";
  weeks.forEach(w=>{
    const count = BANK.filter(b=>b.w===w).length;
    const el = document.createElement("div");
    el.className = "chip"; el.dataset.scope = "w"+w;
    el.innerHTML = `<div class="w">${w}주차${w===8?" ★":""}</div><div class="c">${count}문항</div>`;
    el.onclick = ()=> startQuiz("w"+w);
    grid.appendChild(el);
  });
  // home stats
  const store = loadStore();
  const total = store.attempts.length;
  const wrongIds = collectWrongIds(store);
  $("#homeStats").innerHTML =
    `<div class="stat"><b>${total}</b>응시 횟수</div>`+
    `<div class="stat"><b>${BANK.length}</b>전체 문항</div>`+
    `<div class="stat"><b>${wrongIds.size}</b>오답 노트 문항</div>`;
  $("#btnWrongOnly").disabled = wrongIds.size===0;
}

/* 가장 최근 시도들의 합집합으로 '아직 틀린' 문항 집합을 만든다.
   같은 문항을 나중에 맞히면 오답노트에서 제거 */
function collectWrongIds(store){
  const status = {}; // id -> 최근 정오 (true=정답)
  store.attempts.forEach(at=>{
    at.results.forEach(r=>{ status[r.id] = r.correct; });
  });
  const ids = new Set();
  Object.keys(status).forEach(id=>{ if(!status[id]) ids.add(id); });
  return ids;
}

/* ===================== quiz flow ===================== */
function startQuiz(scope){
  let pool;
  if(scope==="all") pool = BANK.slice();
  else if(scope==="wrong"){
    const ids = collectWrongIds(loadStore());
    pool = BANK.filter(b=>ids.has(b.id));
    if(pool.length===0){ alert("오답 노트가 비어 있습니다."); return; }
  } else {
    const w = parseInt(scope.replace("w",""),10);
    pool = BANK.filter(b=>b.w===w);
  }
  if($("#optShuffleQ").checked) pool = shuffle(pool);

  // 보기 셔플 적용 시 각 문항에 표시용 매핑 생성
  const shuffleC = $("#optShuffleC").checked;
  const items = pool.map(b=>{
    let order = b.c.map((_,i)=>i);
    if(shuffleC) order = shuffle(order);
    return { ref:b, order };
  });

  session = { scope, items, idx:0, results:[] };
  showView("quiz");
  renderQuestion();
}

function renderQuestion(){
  const {items, idx} = session;
  const item = items[idx]; const b = item.ref;
  $("#qScope").textContent = scopeLabel(session.scope)+" · "+b.w+"주차"+(session.scope.startsWith("v")?" [변형]":"");
  $("#qCount").textContent = (idx+1)+" / "+items.length;
  $("#qBar").style.width = ((idx)/items.length*100)+"%";
  $("#qText").textContent = b.q;

  const wrap = $("#qChoices"); wrap.innerHTML="";
  const fb = $("#qFeedback"); fb.className="feedback"; fb.innerHTML="";
  $("#btnNext").disabled = true;
  $("#btnNext").textContent = (idx===items.length-1) ? "결과 보기" : "다음 →";

  item.order.forEach((origIdx, displayPos)=>{
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = `<span class="k">${displayPos+1}</span><span>${b.c[origIdx]}</span>`;
    btn.onclick = ()=> selectChoice(origIdx, btn);
    wrap.appendChild(btn);
  });
}

function selectChoice(chosenIdx, btn){
  const item = session.items[session.idx]; const b = item.ref;
  if(item.answered) return;
  item.answered = true;
  const correct = chosenIdx === b.a;

  // lock & color all
  const nodes = $("#qChoices").children;
  item.order.forEach((origIdx, pos)=>{
    const node = nodes[pos];
    node.classList.add("locked");
    if(origIdx===b.a) node.classList.add("correct");
    if(origIdx===chosenIdx && !correct) node.classList.add("chosen-wrong");
  });

  const fb = $("#qFeedback");
  if(correct){
    fb.className = "feedback show ok";
    fb.innerHTML = "정답입니다.";
  } else {
    fb.className = "feedback show no";
    fb.innerHTML = `오답입니다. 정답: <b>${b.c[b.a]}</b>`;
  }

  session.results.push({
    id:b.id, w:b.w, n:b.n, q:b.q,
    chosen:b.c[chosenIdx], answer:b.c[b.a], correct
  });
  $("#btnNext").disabled = false;
}

$("#btnNext").onclick = ()=>{
  if(session.idx < session.items.length-1){
    session.idx++; renderQuestion();
  } else {
    finishQuiz();
  }
};
$("#btnQuit").onclick = ()=>{ if(confirm("진행 중인 퀴즈를 그만둘까요? (기록은 저장되지 않습니다)")){ session=null; showView("home"); renderHome(); } };

function finishQuiz(){
  const correctN = session.results.filter(r=>r.correct).length;
  const total = session.results.length;
  // save
  const store = loadStore();
  store.attempts.push({
    ts: Date.now(),
    scope: session.scope,
    scopeLabel: scopeLabel(session.scope),
    correct: correctN, total,
    results: session.results
  });
  saveStore(store);

  // render result
  $("#qBar").style.width="100%";
  $("#rScore").textContent = correctN;
  $("#rTotal").textContent = total;
  const pct = total? Math.round(correctN/total*100):0;
  $("#rPct").textContent = `정답률 ${pct}% · ${scopeLabel(session.scope)}`;
  const misses = session.results.filter(r=>!r.correct);
  $("#rMissTitle").textContent = misses.length? `틀린 문항 (${misses.length})` : "전부 정답입니다 🎉";
  $("#rMisses").innerHTML = misses.length ? misses.map(missCard).join("") : `<p class="empty">이번 세트는 오답이 없습니다.</p>`;
  $("#btnRetryWrong").disabled = misses.length===0;
  showView("result");
}

function missCard(r){
  return `<div class="miss">
    <div class="mq">[${r.w}주차 ${r.n}번] ${escapeHtml(r.q)}</div>
    <div class="ml"><span class="x">✗ 내 답: ${escapeHtml(r.chosen)}</span></div>
    <div class="ml"><span class="o">✓ 정답: ${escapeHtml(r.answer)}</span></div>
  </div>`;
}
function escapeHtml(s){ return s.replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

$("#btnRetryWrong").onclick = ()=>{
  const wrongIds = new Set(session.results.filter(r=>!r.correct).map(r=>r.id));
  // 직전 오답만으로 새 세션 — 현재 세션의 은행(원본/변형) 유지
  const isVariant = session.scope && (session.scope.startsWith("v"));
  const currentBank = isVariant ? BANK_V : BANK;
  let pool = currentBank.filter(b=>wrongIds.has(b.id));
  if($("#optShuffleQ").checked) pool = shuffle(pool);
  const items = pool.map(b=>({ref:b, order:b.c.map((_,i)=>i)}));
  session = { scope:"wrong", items, idx:0, results:[] };
  showView("quiz"); renderQuestion();
};
$("#btnHome").onclick = ()=>{ const isV = session && session.scope && session.scope.startsWith("v"); session=null; if(isV){ showView("variant"); renderVariant(); } else { showView("home"); renderHome(); } };

$("#btnWrongOnly").onclick = ()=> startQuiz("wrong");
$("#btnAll").onclick = ()=> startQuiz("all");

/* ===================== history ===================== */
function renderHistory(){
  const store = loadStore();
  const at = store.attempts.slice().reverse();
  // stats
  let totalQ=0, totalC=0;
  store.attempts.forEach(a=>{ totalQ+=a.total; totalC+=a.correct; });
  const wrongIds = collectWrongIds(store);
  $("#histStats").innerHTML =
    `<div class="stat"><b>${store.attempts.length}</b>총 응시</div>`+
    `<div class="stat"><b>${totalQ? Math.round(totalC/totalQ*100):0}%</b>누적 정답률</div>`+
    `<div class="stat"><b>${wrongIds.size}</b>현재 오답 노트</div>`;

  const list = $("#histList");
  if(at.length===0){ list.innerHTML = `<p class="empty">아직 응시 기록이 없습니다. 퀴즈를 한 번 풀어보세요.</p>`; return; }
  list.innerHTML = at.map(a=>{
    const d = new Date(a.ts);
    const dstr = `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    const pct = a.total? Math.round(a.correct/a.total*100):0;
    const misses = a.results.filter(r=>!r.correct);
    const body = misses.length
      ? misses.map(missCard).join("")
      : `<p class="empty">오답 없음 — 전부 정답</p>`;
    return `<details class="attempt">
      <summary>
        <span>
          <span class="a-score" style="color:${pct>=80?'var(--right)':pct>=50?'var(--warn)':'var(--wrong)'}">${a.correct}/${a.total}</span>
          &nbsp;<span style="color:var(--ink-dim)">${a.scopeLabel}</span>
        </span>
        <span class="a-meta">${dstr}</span>
      </summary>
      <div class="a-body">${body}</div>
    </details>`;
  }).join("");
}
function pad(n){ return String(n).padStart(2,"0"); }

$("#btnClear").onclick = ()=>{
  if(confirm("저장된 모든 응시 기록과 오답 노트를 삭제할까요? 되돌릴 수 없습니다.")){
    saveStore({attempts:[]});
    renderHistory(); renderHome();
  }
};

/* ===================== view / tabs ===================== */
function showView(name){
  $("#view-home").classList.toggle("hidden", name!=="home");
  $("#view-variant").classList.toggle("hidden", name!=="variant");
  $("#view-quiz").classList.toggle("hidden", name!=="quiz");
  $("#view-result").classList.toggle("hidden", name!=="result");
  $("#view-history").classList.toggle("hidden", name!=="history");
  document.querySelectorAll(".tabs").forEach(t=>t.classList.toggle("hidden", name==="quiz"||name==="result"));
  window.scrollTo({top:0, behavior:"smooth"});
}
document.querySelectorAll(".tab").forEach(t=>{
  t.onclick = ()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
    t.classList.add("on");
    const tab = t.dataset.tab;
    if(tab==="home"){ showView("home"); renderHome(); }
    else if(tab==="variant"){ showView("variant"); renderVariant(); }
    else { showView("history"); renderHistory(); }
  };
});

/* ===================== init ===================== */
renderHome();
renderVariant();
</script>
</body>
</html>
